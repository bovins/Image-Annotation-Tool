<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图像标注工具</title>
<link rel="stylesheet" href="css/style.css?v=2026.11.09.1">
</head>
<body>
<script>
/* 老旧浏览器检测（IE11 / 远古浏览器）：提示改用现代浏览器 */
(function () {
  var ok = true;
  try { eval('var __f = function () { return 1; }; var __g = () => 1;'); } catch (e) { ok = false; }
  try { var __c = document.createElement('canvas'); if (!__c.getContext || !__c.getContext('2d')) ok = false; } catch (e) { ok = false; }
  if (ok && !window.Promise) ok = false;
  if (!ok) {
    document.write('<div style="padding:40px;font-family:Microsoft YaHei,sans-serif;line-height:2.2;color:#333">' +
      '⚠️ 当前浏览器过于老旧，无法运行标注工具。<br>' +
      '请使用现代浏览器：<b>Chrome 109+</b>、<b>Firefox 115 ESR+</b> 或 <b>Edge 109+</b>' +
      '（这些是 Windows 7 最后支持的浏览器版本，安装后即可使用）。</div>');
  }
})();
</script>

<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-copy"><strong>图像标注</strong><small>IMAGE ANNOTATOR</small></span><span class="offline-badge">离线</span></div>
  <div class="actions">
    <div class="action-group file-actions" aria-label="图片与工程">
    <button class="btn primary" id="btnUpload">📤 上传图片</button>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button class="btn" id="btnSave" title="保存工程（JSON，可再次载入编辑）">📦 保存工程</button>
    <button class="btn" id="btnLoad" title="载入已保存的工程">📂 载入工程</button>
    <details class="top-menu" id="workspaceMenu">
      <summary class="btn" title="多图工作区管理">工作区 <span class="menu-chevron" aria-hidden="true">⌄</span></summary>
      <div class="menu-items">
        <div class="menu-caption">多图工程</div>
        <button class="btn" id="btnSaveWorkspace" title="保存全部标签页">保存工作区</button>
        <button class="btn" id="btnLoadWorkspace" title="载入工作区为新标签页，不覆盖当前内容">载入工作区</button>
      </div>
    </details>
    <input type="file" id="projectInput" accept=".json,application/json" hidden>
    </div>
    <div class="action-group export-actions-top" aria-label="导出">
      <button class="btn" id="btnExport" title="导出无损 PNG（图片外区域透明）">💾 导出 PNG</button>
      <button class="btn" id="btnExportJpg" title="导出体积更小的 JPG（白色背景，速度更快）">🖼 导出 JPG</button>
      <button class="btn" id="btnCopy" title="一键复制 PNG 到剪贴板，可直接粘贴">📋 复制 PNG</button>
    </div>
    <div class="action-group history-actions" aria-label="编辑历史">
    <button class="btn" id="btnUndo" title="撤销 Ctrl+Z">↩ 撤销</button>
    <button class="btn" id="btnRedo" title="重做 Ctrl+Y">↪ 重做</button>
    <button class="btn" id="btnDel" title="删除选中 Delete">🗑 删除</button>
    </div>
    <div class="action-group view-actions" aria-label="界面设置">
    <button class="btn" id="btnTheme" title="切换亮/暗主题">🌙</button>
    <button class="btn" id="btnSidebar" title="折叠/展开左面板" aria-expanded="true">工具面板</button>
    <button class="btn" id="btnPanel" title="折叠/展开右面板" aria-expanded="true">属性面板</button>
    <button class="btn" id="btnHelp" title="查看快捷键说明">快捷键 ?</button>
    </div>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="side-title">标注工具</div>
    <button class="tool-btn active" data-tool="select"><span class="tico">🖱️</span>选择 / 移动</button>
    <div class="group tools-group">
      <div class="gtitle">基础类</div>
      <button class="tool-btn" data-tool="text"><span class="tico">🅰️</span>文字</button>
      <button class="tool-btn" data-tool="rect"><span class="tico">▭</span>矩形</button>
      <button class="tool-btn" data-tool="msgbox"><span class="tico">💬</span>消息框</button>
      <button class="tool-btn" data-tool="line"><span class="tico">╱</span>直线</button>
      <button class="tool-btn" data-tool="curve"><span class="tico">〰</span>曲线</button>
      <button class="tool-btn" data-tool="freehand"><span class="tico">✏️</span>手写</button>
      <button class="tool-btn" data-tool="arrow"><span class="tico">➜</span>箭头</button>
      <button class="tool-btn" data-tool="carrow"><span class="tico">➶</span>曲线箭头</button>
      <button class="tool-btn" data-tool="step"><span class="tico">①</span>步骤序号</button>
    </div>

    <div class="group">
      <div class="gtitle">尺规类</div>
      <button class="tool-btn" data-tool="dim"><span class="tico">📏</span>尺寸</button>
      <button class="tool-btn" data-tool="angle"><span class="tico">📐</span>角度</button>
      <button class="tool-btn" data-tool="area"><span class="tico">📊</span>面积</button>
    </div>

    <div class="group">
      <div class="gtitle">引出类</div>
      <button class="tool-btn" data-tool="ctext"><span class="tico">📝</span>文字引出</button>
      <button class="tool-btn" data-tool="cregion"><span class="tico">⭕</span>引出区域</button>
      <button class="tool-btn" data-tool="cimage"><span class="tico">🖼️</span>图引出</button>
      <button class="tool-btn" data-tool="cmulti"><span class="tico">🔗</span>多引出</button>
    </div>

    <div class="group">
      <div class="gtitle">放大镜</div>
      <button class="tool-btn" data-tool="magnifier"><span class="tico">🔍</span>放大镜</button>
      <button class="tool-btn" data-tool="smagnifier"><span class="tico">🔲</span>方放大镜</button>
    </div>

    <div class="group">
      <div class="gtitle">贴图类</div>
      <button class="tool-btn" data-tool="sticker"><span class="tico">🏷️</span>贴图</button>
      <button class="tool-btn" data-tool="mosaic"><span class="tico">🧩</span>马赛克</button>
    </div>

    <div class="side-title workflow-title">绘制辅助</div>
    <div id="efficiencyBox"></div>
  </aside>

  <div class="stage">
    <div class="stage-main">
      <div class="tabbar" id="tabbar"></div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="c" width="900" height="600"></canvas>
        <div class="drop-tip" id="dropTip"><div class="empty-card"><div class="empty-symbol" aria-hidden="true"></div><span class="empty-eyebrow">本地图像工作台</span><h1>把图片拖到这里，开始标注</h1><p>或点击上传图片 · 支持 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴</p><span class="empty-privacy">纯前端离线处理，文件不会上传</span></div></div>
        <div class="zoom-tools" aria-label="画布缩放">
          <button class="btn" id="btnZoomOut" title="缩小">−</button>
          <button class="btn" id="btnZoomPct" title="100% 显示">100%</button>
          <button class="btn" id="btnZoomIn" title="放大">+</button>
          <span class="vsep"></span>
          <button class="btn" id="btnFit" title="适应窗口">适应窗口</button>
        </div>
      </div>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="panel-heading"><strong>属性检查器</strong><span>PROPERTIES</span></div>
    <div class="property-switch" role="group" aria-label="属性范围">
      <button id="btnGlobalProps" type="button" aria-pressed="true" aria-controls="globalPanel">全局属性</button>
      <button id="btnObjectProps" type="button" aria-pressed="false" aria-controls="panelContent">单个样式</button>
    </div>
    <section id="globalPanel" class="property-content" aria-label="全局属性">
      <p class="property-caption">默认样式用于新建标注。测量比例按图片单独保存。</p>
      <div id="presetBox"></div>
      <div id="globalStyleBox"></div>
    </section>
    <section id="panelContent" class="property-content" aria-label="单个样式" hidden></section>
    <div class="layers-box">
      <div class="layers-head">
        <span class="layers-title">图层</span>
        <button class="btn small" id="btnAddLayer" title="新建图层">＋ 新建</button>
      </div>
      <div class="layers-list" id="layersList"></div>
    </div>
  </aside>
</div>

<footer class="hintbar"><span id="hint">请先上传图片，然后选择左侧标注工具开始标注。</span><span id="saveStatus"></span><span id="draftStatus" title="浏览器草稿可能被清理，请另存工程文件备份">浏览器草稿不代替工程备份</span><span id="appVersion">构建 2026.11.09.1</span></footer>
<div id="toast"></div>
<div id="exporting"><div class="spinner"></div>正在导出图片…</div>

<script src="vendor/fabric.min.js"></script>
<script src="js/objects.js?v=2026.11.09.1"></script>
<script src="js/resources.js?v=2026.11.09.1"></script>
<script src="js/project-store.js?v=2026.11.09.1"></script>
<script src="js/export-renderer.js?v=2026.11.09.1"></script>
<script src="js/tools.js?v=2026.11.09.1"></script>
<script src="js/app.js?v=2026.11.09.1"></script>
<script src="js/efficiency.js?v=2026.11.09.1"></script>
<script src="js/export-ui.js?v=2026.11.09.1"></script>
<script src="js/icons.js?v=2026.11.09.1"></script>
<script src="js/ui.js?v=2026.11.09.1"></script>
<script>if (!window.fabric) { document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#c33">本地 Fabric.js 文件缺失。请完整解压项目并保留 vendor 文件夹。</div>'; }</script>
</body>
</html>
