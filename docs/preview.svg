<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <!-- 暗色画布点阵背景 -->
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#33344a"/>
    </pattern>
    <!-- “照片”渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecae6"/>
      <stop offset="0.55" stop-color="#cfe8f2"/>
      <stop offset="0.56" stop-color="#9cc38f"/>
      <stop offset="1" stop-color="#6f9e5c"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa7d8"/>
      <stop offset="1" stop-color="#3a7bb4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="#1e1f26"/>
  <rect width="800" height="520" fill="url(#dots)"/>

  <!-- ===== 图片（占位“照片”） ===== -->
  <rect x="110" y="70" width="580" height="350" rx="6" fill="url(#sky)"/>
  <circle cx="620" cy="115" r="26" fill="#f7d774"/>
  <!-- 远山 -->
  <path d="M110 420 L240 260 L330 340 L420 250 L560 380 L690 290 L690 420 Z" fill="#5f8a4e"/>
  <path d="M110 420 L300 320 L410 400 L520 330 L690 410 L690 420 Z" fill="#486e3a"/>
  <!-- 湖面 -->
  <path d="M110 420 L690 420 L690 380 Q400 350 110 390 Z" fill="url(#lake)"/>

  <!-- ===== 标注 1：矩形（白色描边 + 红色边框 + 半透明填充） ===== -->
  <rect x="330" y="200" width="150" height="90" fill="rgba(255,82,82,0.16)" stroke="#ffffff" stroke-width="4"/>
  <rect x="330" y="200" width="150" height="90" fill="none" stroke="#ff5252" stroke-width="2.5"/>

  <!-- ===== 标注 2：箭头 ===== -->
  <line x1="205" y1="350" x2="352" y2="290" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="205" y1="350" x2="352" y2="290" stroke="#ff5252" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="352,290 336,302 341,282" fill="#ffffff" transform="translate(352 290) scale(1.3) translate(-352 -290)"/>
  <polygon points="352,290 336,302 341,282" fill="#ff5252"/>
  <circle cx="205" cy="350" r="6" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <circle cx="352" cy="290" r="6" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>

  <!-- ===== 标注 3：文字引出（锚点 → 引出线 → 水平线 → 线上文字，无方框） ===== -->
  <line x1="300" y1="175" x2="470" y2="175" stroke="#ffffff" stroke-width="5"/>
  <line x1="300" y1="175" x2="470" y2="175" stroke="#ffd166" stroke-width="2.5"/>
  <line x1="330" y1="245" x2="342" y2="179" stroke="#ffffff" stroke-width="5"/>
  <line x1="330" y1="245" x2="342" y2="179" stroke="#ffd166" stroke-width="2.5"/>
  <!-- 箭头指向锚点（白色描边 + 实心） -->
  <polygon points="330,245 344,240 337,229" fill="#ffffff" transform="translate(330 245) scale(1.3) translate(-330 -245)"/>
  <polygon points="330,245 344,240 337,229" fill="#ffd166"/>
  <circle cx="330" cy="245" r="7" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
  <text x="385" y="165" text-anchor="middle" font-size="21" fill="#ffffff" font-weight="600">关键区域</text>

  <!-- ===== 标注 4：步骤序号 ===== -->
  <circle cx="180" cy="130" r="17" fill="#5b8def" stroke="#ffffff" stroke-width="3"/>
  <text x="180" y="138" text-anchor="middle" font-size="22" fill="#ffffff" font-weight="700">1</text>

  <!-- ===== 标注 5：尺寸测量 ===== -->
  <line x1="150" y1="460" x2="460" y2="460" stroke="#ffffff" stroke-width="5"/>
  <line x1="150" y1="460" x2="460" y2="460" stroke="#4cd964" stroke-width="2.5"/>
  <line x1="150" y1="445" x2="150" y2="475" stroke="#4cd964" stroke-width="2.5"/>
  <line x1="460" y1="445" x2="460" y2="475" stroke="#4cd964" stroke-width="2.5"/>
  <rect x="270" y="448" width="70" height="24" rx="4" fill="#1e1f26"/>
  <text x="305" y="466" text-anchor="middle" font-size="16" fill="#ffffff">300 px</text>

  <!-- ===== 文字手柄（蓝色圆点） ===== -->
  <circle cx="385" cy="154" r="6" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
</svg>
